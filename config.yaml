# Shared settings for test/ and demos/. Scripts read this file at startup.

# Radio URIs. Read a drone's address in cfclient: Connect > Configure 2.x.
drones:
  - name: cf1
    uri: radio://0/80/2M/E7E7E7E7E9

flight:
  takeoff_height: 0.5      # m
  fence:                   # world-frame box (Lighthouse frame) the drone must stay inside, m
    x: [-1.0, 1.0]
    y: [-1.0, 1.0]
    z: [0.2, 1.4]
  max_speed: 0.5           # m/s, keyboard and hand position control
  state_timeout: 0.25      # s without a position estimate before the script lands

camera:
  index: 0
  width: 640
  height: 480
  mirror: true             # flip so moving your hand right moves it right on screen

hand:
  model_path: models/hand_landmarker.task   # downloaded automatically on first run
  min_detection_confidence: 0.6
  min_tracking_confidence: 0.5
  grab_below: 1.30         # openness ratio below this -> grabbed (fist)
  release_above: 1.60      # openness ratio above this -> released (open hand)
  debounce_frames: 3       # frames the new state must persist before it switches
  lost_timeout: 0.3        # s without a hand before it counts as released
  filter_min_cutoff: 1.0   # One Euro filter: lower = smoother when the hand is still
  filter_beta: 0.05        # One Euro filter: higher = less lag when the hand moves fast

mapping:
  horizontal: x            # world axis driven by moving the hand left/right in the image
  vertical: z              # world axis driven by moving the hand up/down in the image
  invert_horizontal: false # true if image-right should be world-negative
  active_u: [0.15, 0.85]   # part of the image width that spans the whole fence
  active_v: [0.15, 0.85]   # part of the image height that spans the whole fence
  fence_margin: 0.1        # m kept clear of the fence walls

# Attitude-command sign conventions, measured with
# demos/single_mass_spring_damper/calibrate_signs.py.
# Each sign is chosen so that a positive physical tilt accelerates the drone
# toward +x (pitch) or +y (roll), and a positive yaw rate increases yaw.
attitude:
  verified: false          # attitude demos refuse to fly until you set this to true
  pitch: -1
  roll: -1
  yaw: 1

single_msd:
  m: 1.0                   # virtual mass, kg
  k: 3.0                   # spring stiffness, N/m
  b: 0.4                   # damping, N*s/m
  x0: 0.0                  # spring rest position along x, m
  y0: 0.0                  # y held here by a separate PD loop, m
  height: 0.7              # flight height, m
  start_offset: 0.0        # initial displacement from x0 after takeoff, m
  k_hand: 8.0              # stiffness of the virtual spring from your hand to the mass, N/m
  b_hand: 1.0              # damping of that hand spring, N*s/m
  max_tilt_deg: 12.0       # pitch/roll clamp; a = g*tan(theta) stays accurate below ~15 deg
  y_kp: 4.0                # y hold, m/s^2 per m
  y_kd: 2.5                # y hold, m/s^2 per m/s
  yaw_kp: 2.0              # yaw hold, deg/s per deg
  max_yawrate: 60.0        # deg/s
  max_yaw_error: 25.0      # deg; land if yaw drifts further than this
  rate_hz: 50
